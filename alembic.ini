# Alembic configuration.
#
# Run every command from the `backend/` directory:
#     alembic upgrade head
#     alembic downgrade -1
#     alembic revision --autogenerate -m "add reports"
#
# The database URL is NOT stored here. `app/migrations/env.py` reads
# DATABASE_URL from the application settings (.env), so there is one source of
# truth and no credentials are committed.

[alembic]
script_location = app/migrations

# Timestamped, readable filenames: 20261010_1430_0002_add_reports.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
timezone = UTC

# Intentionally blank - supplied by env.py from DATABASE_URL.
sqlalchemy.url =


[post_write_hooks]
# No automatic formatting configured.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
