[pytest]
# Run pytest from the `backend/` directory.
# `pythonpath = .` puts backend/ on sys.path so `import app` resolves without
# an editable install.
pythonpath = .
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

markers =
    smoke: fast checks that the application boots and serves traffic
    contract: guards a shared interface Developer 2 depends on
    phase1: asserts a Phase 1 restriction, such as "no database"
