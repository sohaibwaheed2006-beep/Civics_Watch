<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Neighborhood Issue Reporter">
  <title>Neighborhood Issue Reporter</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile background -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- Map pin silhouette -->
  <path
    d="M32 11c-7.73 0-14 6.27-14 14 0 10.5 14 28 14 28s14-17.5 14-28c0-7.73-6.27-14-14-14z"
    fill="#ffffff"/>
  <!-- Alert mark inside the pin -->
  <rect x="30" y="19" width="4" height="10" rx="2" fill="#f59e0b"/>
  <circle cx="32" cy="33" r="2.3" fill="#f59e0b"/>
</svg>
